<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JSON → TypeScript</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --border: #e2e5ea;
        --text: #1c2024;
        --muted: #6b7280;
        --accent: #2563eb;
        --ok: #15803d;
        --error: #dc2626;
        --code-bg: #f3f4f6;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --panel: #171a21;
          --border: #262b34;
          --text: #e6e9ef;
          --muted: #9aa2b1;
          --accent: #4f8cff;
          --ok: #4ade80;
          --error: #f87171;
          --code-bg: #0b0d11;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 18px 22px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      header h1 { font-size: 17px; margin: 0; font-weight: 650; }
      header .sub { color: var(--muted); font-size: 13px; }
      header a { color: var(--accent); text-decoration: none; }
      .options {
        display: flex;
        gap: 16px 18px;
        align-items: center;
        flex-wrap: wrap;
        padding: 12px 22px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        font-size: 13px;
      }
      .options label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
      .options input[type="text"],
      .options select {
        font: inherit;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
      }
      .options input[type="text"] { width: 120px; }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--border);
        min-height: calc(100vh - 165px);
      }
      @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
      .pane { display: flex; flex-direction: column; background: var(--panel); min-width: 0; }
      .pane-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      .pane-head .actions { display: flex; gap: 6px; }
      button {
        font: inherit;
        font-size: 12px;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      textarea, pre {
        flex: 1;
        margin: 0;
        padding: 14px;
        border: 0;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.6;
        background: var(--code-bg);
        color: var(--text);
        overflow: auto;
        tab-size: 2;
      }
      textarea { resize: none; outline: none; white-space: pre; }
      pre { white-space: pre; }
      footer {
        padding: 8px 22px;
        border-top: 1px solid var(--border);
        font-size: 13px;
        background: var(--panel);
      }
      #status[data-kind="ok"] { color: var(--ok); }
      #status[data-kind="error"] { color: var(--error); }
      #status[data-kind="muted"] { color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>JSON → TypeScript</h1>
      <span class="sub">Paste JSON, get types. Runs entirely in your browser — nothing is uploaded.</span>
    </header>

    <div class="options">
      <label>Root name <input type="text" id="rootName" value="Root" /></label>
      <label>
        Style
        <select id="declaration">
          <option value="interface">interface</option>
          <option value="type">type</option>
        </select>
      </label>
      <label>
        Unknowns
        <select id="unknownType">
          <option value="unknown">unknown</option>
          <option value="any">any</option>
        </select>
      </label>
      <label><input type="checkbox" id="readonly" /> readonly</label>
      <label><input type="checkbox" id="export" /> export</label>
    </div>

    <main>
      <section class="pane">
        <div class="pane-head">
          <span>JSON input</span>
          <div class="actions">
            <button id="sample">Sample</button>
            <button id="clear">Clear</button>
          </div>
        </div>
        <textarea id="input" spellcheck="false" placeholder='{ "hello": "world" }'></textarea>
      </section>
      <section class="pane">
        <div class="pane-head">
          <span>TypeScript output</span>
          <div class="actions">
            <button id="copy" class="primary" disabled>Copy</button>
          </div>
        </div>
        <pre><code id="output"></code></pre>
      </section>
    </main>

    <footer><span id="status" data-kind="muted">Paste some JSON to get started.</span></footer>

</html>
